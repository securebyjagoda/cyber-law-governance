- id: art-44-46
  number: "Articles 44-46"
  short: "Arts. 44-46"
  title: "Transfers of personal data to third countries"
  theme: "Third parties and transfers"
  summary: "Restricts sending personal data outside the European Economic Area unless its level of protection travels with it."
  requires: "Personal data may be transferred to a country outside the EEA only if the protection it receives is not undermined (Art. 44). Under Art. 45, the European Commission can decide that a country, territory, or sector ensures an adequate level of protection. In assessing this, it considers the rule of law and human rights, whether independent supervisory authorities exist and work effectively, and the country's international commitments, and it must review the decision at least every four years. Without an adequacy decision, a transfer is allowed only if the exporter provides appropriate safeguards, such as standard contractual clauses (Art. 46), and individuals have enforceable rights and effective remedies."
  status: "The European Commission adopted an adequacy decision for the EU-US Data Privacy Framework in July 2023, covering certified US organizations. The EU General Court dismissed a challenge to it on 3 September 2025, and an appeal is pending before the Court of Justice (Case C-703/25 P). Some commentators say the US Supreme Court's June 2026 ruling in Trump v. Slaughter raises new questions about the independence of the FTC oversight the decision relies on. Check the European Commission's page for the current position."
  relevance: "Particularly relevant when European property information is shared with firms, investors, or service providers outside the European Economic Area. Article 45 addresses adequacy decisions, while Article 46 provides mechanisms such as Standard Contractual Clauses."
  question: "How do international data transfer restrictions affect cybersecurity obligations in cross-border real estate transactions?"
  controls: [third-party-risk-assessment]
  phases: [3, 5]
  references:
