- id: art-28
  number: "Article 28"
  short: "Art. 28"
  title: "Processor"
  theme: "Third parties and transfers"
  summary: "Controls how a controller may use outside providers to process personal data on its behalf."
  requires: "A controller must use only processors that provide sufficient guarantees of appropriate technical and organizational measures. A processor cannot engage another processor without the controller's written authorization. The processing must be governed by a contract or other legal act that requires, among other things:"
  points:
    - "Processing only on the controller's documented instructions."
    - "Implementation of all the security measures in Article 32."
    - "Assistance to the controller in meeting its obligations under Articles 32 to 36."
    - "Deletion or return of the data when the services end."
    - "Making available all information needed to demonstrate compliance, and allowing audits."
  relevance: "Useful for studying third-party risks associated with cloud-hosted property management systems, tenant screening services, virtual tours, and payment processors."
  question: "How should liability and cybersecurity responsibilities be allocated between real estate firms and their third-party technology providers?"
  controls: [third-party-risk-assessment]
  references:
    - name: "GDPR full text, Article 28"
      publisher: "EUR-Lex"
      detail: "Regulation (EU) 2016/679"
      url: "https://eur-lex.europa.eu/eli/reg/2016/679/oj"
    - name: "Guidelines 07/2020 on the concepts of controller and processor in the GDPR"
