- id: corporate
  name: "Corporate Information"
  level: 1
  sensitivity: "Medium"
  url: /data/corporate-information/
  tagline: "Ownership, structure, and legitimacy of an organization."
  summary: "Information used to establish that an entity legally exists, who owns and controls it, and whether it can meet its obligations. It forms the foundation of most due diligence investigations."
  sensitive: "Less sensitive than personal information, but ownership details and confidential business information still need protection."
  typical: "Registration records, ownership and shareholder information, leadership, organizational structure."
  risks: "Excessive data collection, unauthorized access or disclosure, and inaccurate records."
  protect: "Verify information against authoritative sources, limit access, encrypt records, and log activity."
  laws:
    - name: "201 CMR 17.00"
      url: /laws/201-cmr-17/
    - name: "M.G.L. c.93H"
      url: /laws/mgl-c93h/
    - name: "Corporate Transparency Act"
    - name: "GDPR"
      url: /laws/gdpr/
  phases: "Pre-Screening, Verification, Financial Checks"

- id: identity
  name: "Identity & Personal Information"
  level: 2
  sensitivity: "High"
  url: /data/identity-personal-information/
  tagline: "Information that can identify an individual."
  summary: "Information that can identify, relate to, describe, or reasonably be associated with an individual. It is often the most heavily regulated data collected during due diligence."
  sensitive: "Frequently targeted by attackers for identity theft, account takeover, social engineering, and fraud."
  typical: "Names, dates of birth, addresses, Social Security numbers, driver's license and passport information."
  risks: "Identity theft, unauthorized access or disclosure, and excessive data collection."
  protect: "Collect only what is necessary, document a lawful purpose, encrypt, and restrict access to authorized staff."
  laws:
    - name: "201 CMR 17.00"
      url: /laws/201-cmr-17/
    - name: "M.G.L. c.93H"
      url: /laws/mgl-c93h/
    - name: "GDPR"
      url: /laws/gdpr/
  phases: "Pre-Screening, Verification"

- id: legal
  name: "Legal & Regulatory Information"
  level: 2
  sensitivity: "High"
  url: /data/legal-regulatory-information/
  tagline: "Contracts, filings, audits, and regulatory history."
  summary: "Records used to evaluate compliance, legal obligations, contractual relationships, and regulatory history."
  sensitive: "Frequently contains confidential business information, contractual obligations, and legal strategies."
  typical: "Contracts, license and partnership agreements, regulatory filings, government audits, tax filings."
  risks: "Unauthorized access or disclosure, excessive retention, and inaccurate records."
  protect: "Restrict access to business need, keep retention schedules and audit trails, and encrypt records."
  laws:
    - name: "201 CMR 17.00"
      url: /laws/201-cmr-17/
    - name: "M.G.L. c.93H"
      url: /laws/mgl-c93h/
    - name: "Corporate Transparency Act"
    - name: "GDPR"
      url: /laws/gdpr/
  phases: "Verification, Criminal & Legal Checks"

- id: criminal
  name: "Criminal & Background Information"
  level: 3
  sensitivity: "Very High"
  url: /data/criminal-background-information/
  tagline: "Criminal history, litigation, and investigations."
  summary: "Information used to assess legal exposure, past misconduct, litigation, and criminal history associated with a third party. It is often one of the most sensitive categories processed during background checks."
  sensitive: "Improper processing can create significant privacy, regulatory, and reputational risks."
  typical: "Criminal records, court filings, litigation history, government investigations, enforcement actions."
  risks: "Inaccurate records, automated decision-making, cross-border transfers, and excessive retention."
  protect: "Confirm the information is necessary and accurate, include human review in decisions, document retention, and restrict access."
  laws:
    - name: "FCRA"
      url: /laws/fcra/
    - name: "GDPR"
      url: /laws/gdpr/
    - name: "201 CMR 17.00"
      url: /laws/201-cmr-17/
    - name: "M.G.L. c.93H"
      url: /laws/mgl-c93h/
  phases: "Criminal & Legal Checks, Sanctions Screening"

- id: financial
  name: "Financial Information"
  level: 2
  sensitivity: "High"
  url: /data/financial-information/
  tagline: "Financial health, credit, and fraud indicators."
  summary: "Data used to evaluate an organization's financial health, stability, creditworthiness, and ability to satisfy contractual obligations."
  sensitive: "Often contains confidential business information and, in some cases, nonpublic personal financial information protected by federal and state rules."
  typical: "Financial statements, credit reports, bankruptcy records, liabilities, cash flow reports."
  risks: "Data breach, unauthorized access or disclosure, excessive retention, and inaccurate records."
  protect: "Maintain a WISP, limit access to need-to-know, document retention periods, and assess vendors."
  laws:
    - name: "GLBA"
      url: /laws/glba/
    - name: "FCRA"
      url: /laws/fcra/
    - name: "201 CMR 17.00"
      url: /laws/201-cmr-17/
    - name: "M.G.L. c.93H"
      url: /laws/mgl-c93h/
    - name: "GDPR"
      url: /laws/gdpr/
  phases: "Verification, Financial Checks, Decision, Documentation & Monitoring"

- id: sanctions
  name: "Sanctions & Watchlist Information"
  level: 2
  sensitivity: "High"
  url: /data/sanctions-watchlist-information/
  tagline: "Sanctions lists, PEPs, and adverse media."
  summary: "Information used to identify restricted, prohibited, or high-risk individuals and organizations, in support of sanctions, anti-money laundering, and financial crime obligations."
  sensitive: "Largely derived from public sources, but results can affect eligibility decisions and need careful handling."
  typical: "OFAC, EU, and UN sanctions results, politically exposed persons, adverse media."
  risks: "Inaccurate screening results, unauthorized disclosure, cross-border transfers, and excessive retention."
  protect: "Follow escalation procedures, document screening decisions, re-screen periodically, and monitor continuously."
  laws:
    - name: "OFAC Sanctions Programs"
      url: /laws/ofac/
    - name: "BSA / AML"
    - name: "201 CMR 17.00"
      url: /laws/201-cmr-17/
    - name: "M.G.L. c.93H"
      url: /laws/mgl-c93h/
    - name: "GDPR"
      url: /laws/gdpr/
  phases: "Sanctions Screening, Decision, Documentation & Monitoring"